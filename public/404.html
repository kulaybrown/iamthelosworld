<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>IAMTHELOSWORLD - Jumpy Run & Arcade Showcase</title>
    <meta 
      name="description" 
      content="Jumpy Run is a 2D pixel endless runner. Connect with Google Sign-In to save your high scores, and compete on the global leaderboard." 
    />
    <!-- Add your Google AdSense / Site Verification meta tags here as well -->
    <meta name="google-adsense-account" content="ca-pub-9125531137074419" />

    <script>
      // Redirect unknown GitHub Pages routes to index.html while preserving path.
      ;(function () {
        var pathSegmentsToKeep = 0
        var l = window.location
        l.replace(
          l.protocol +
            '//' +
            l.hostname +
            (l.port ? ':' + l.port : '') +
            l.pathname
              .split('/')
              .slice(0, 1 + pathSegmentsToKeep)
              .join('/') +
            '/?/' +
            l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
            (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
            l.hash,
        )
      })()
    </script>
  </head>
  <body>
    <h1>Jumpy Run - IAMTHELOSWORLD</h1>
    <p>Jumpy Run is a 2D pixel endless runner. Connect with Google Sign-In to save your high scores, and compete on the global leaderboard.</p>
  </body>
